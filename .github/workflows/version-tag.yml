name: Resolve Version Tag

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}

jobs:
  version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve/Create release tag
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force

          existing_tag=$(git tag --points-at HEAD 'v*' | head -n1 || true)
          if [ -n "${existing_tag}" ]; then
            echo "Reusing existing tag ${existing_tag}"
            echo "version=${existing_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "${latest_tag}" ]; then
            latest_tag="v1.0.0"
          fi

          version_core=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "${version_core}"

          next_patch=$((patch + 1))
          next_tag="v${major}.${minor}.${next_patch}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${next_tag}" -m "Release ${next_tag}"
          git push origin "${next_tag}"

          echo "version=${next_tag}" >> "$GITHUB_OUTPUT"
