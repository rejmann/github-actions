name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the binary; also the git ref checked out when set (e.g. v1.0.2).
        type: string
        required: false
        default: ""
      platform:
        description: "Target platform: all, linux, darwin, or windows"
        type: string
        required: false
        default: all
      name:
        description: Binary and artifact name (e.g. pvm, ponto).
        type: string
        required: false
        default: pvm
      package:
        description: Go package to build, relative to the repo root (e.g. ., ./cmd/ponto).
        type: string
        required: false
        default: .

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          # Itens sem colchetes, para poderem ser concatenados no caso "all".
          LINUX='{"goos":"linux","goarch":"amd64","archive_ext":".tar.gz"},{"goos":"linux","goarch":"arm64","archive_ext":".tar.gz"}'
          DARWIN='{"goos":"darwin","goarch":"amd64","archive_ext":".tar.gz"},{"goos":"darwin","goarch":"arm64","archive_ext":".tar.gz"}'
          WINDOWS='{"goos":"windows","goarch":"amd64","archive_ext":".zip"}'

          case "${PLATFORM}" in
            linux) ITEMS="$LINUX" ;;
            darwin) ITEMS="$DARWIN" ;;
            windows) ITEMS="$WINDOWS" ;;
            all) ITEMS="$LINUX,$DARWIN,$WINDOWS" ;;
            *) echo "::error::platform invalida: ${PLATFORM} (use all, linux, darwin ou windows)"; exit 1 ;;
          esac

          MATRIX="{\"include\":[${ITEMS}]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: prepare-matrix
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version || 'dev' }}
          NAME: ${{ inputs.name }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail

          OUT_DIR=dist/${GOOS}-${GOARCH}
          BIN=${NAME}
          if [ "${GOOS}" = "windows" ]; then
            BIN="${NAME}.exe"
          fi
          mkdir -p "${OUT_DIR}"

          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${OUT_DIR}/${BIN}" "${PACKAGE}"

          cd "${OUT_DIR}"

          PACK_CMD=$([ "${GOOS}" = "windows" ] && echo "zip -9" || echo "tar -czf")
          ${PACK_CMD} "../${NAME}-${GOOS}-${GOARCH}${{ matrix.archive_ext }}" "${BIN}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ inputs.name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.archive_ext }}
